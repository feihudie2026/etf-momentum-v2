name: Run Momentum Strategy

on:
  schedule:
    - cron: '30 6 * * *'   # 每天北京时间 14:30
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pandas numpy akshare

      - name: Run momentum script
        run: python momentum.py

      - name: Commit and push if changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/index.html docs/signals.csv
          git diff --staged --quiet || (git commit -m 'Update ETF monitor' && git push)
